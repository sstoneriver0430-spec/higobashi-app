const SHIFT_ALIAS = [["donhatlinh", "リン"], ["wangqi", "オウ"], ["ベギュグ", "ギュ"], ["baegyu", "ギュ"]];

// アプリのURL（#mk=...）で届いたデータを読む
function mkDecode(b64) {
  try {
    const s = decodeURIComponent(escape(atob(b64.replace(/-/g, "+").replace(/_/g, "/"))));
    const j = JSON.parse(s); const out = {};
    Object.entries(j.days || {}).forEach(([d, ps]) => {

      out[d] = ps.filter(p => p && p.name && Array.isArray(p.segs)).map(p => ({
        name: shFixName(String(p.name).slice(0, 40)),

        segs: p.segs.filter(x => Number.isFinite(x.s) && Number.isFinite(x.e) && x.e > x.s).map(x => ({ s: x.s, e: x.e, label: String(x.label || "").slice(0, 20), type: ["work", "blue", "other"].includes(x.type) ? x.type : "work" }))
      })).filter(p => p.segs.length);
    });
    return Object.keys(out).length ? out : null;
  } catch (e) { return null; }
}
