  for (let d = 1; d <= today; d++) {
    const w = new Date(year, month0, d).getDay();
    const base = (w === 0 || w === 6) ? 230000 : 175000;
    const uday = Math.round((base + (rnd() - 0.5) * 50000) / 10) * 10;

    const day = [0, 1, 2, 3, 4, 5, 6].reduce((s, w) => s + it.rate * (basis.avg[w] || 0) / 1e5, 0) / 7;

  });

}

// 新しい版が出ていたら知らせる（ホーム画面のアプリは再読み込みボタンがないため）
function UpdateBanner() {
  const [nv, setNv] = useState("");
  useEffect(() => {
    let stop = false;
    const check = () => {
      if (stop || location.protocol === "file:") return;
      fetch(location.pathname + "?v=" + Date.now(), { cache: "reload" }).then(r => r.ok ? r.text() : "")
        .then(t => { const m = /const APP_VER = "([^"]+)"/.exec(t || ""); if (m && m[1] !== APP_VER) setNv(m[1]); }).catch(() => {});
    };
    check();
    const onVis = () => { if (document.visibilityState === "visible") check(); };
    document.addEventListener("visibilitychange", onVis);
    const iv = setInterval(check, 5 * 60 * 1000);
    return () => { stop = true; document.removeEventListener("visibilitychange", onVis); clearInterval(iv); };
  }, []);
  if (!nv) return null;
  const update = () => { fetch(location.pathname, { cache: "reload" }).catch(() => {}).finally(() => location.reload()); };
  return h("button", { type: "button", onClick: update, className: "fk-tap",
    style: { position: "fixed", left: 12, right: 12, top: "calc(env(safe-area-inset-top, 0px) + 10px)", zIndex: 9999, border: "none", borderRadius: 14, background: C.drop, color: "#fff", padding: "12px 16px", fontFamily: FONT, fontSize: 14.5, fontWeight: 800, boxShadow: "0 8px 24px rgba(0,0,0,.22)", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10 } },
    h("span", { style: { textAlign: "left", lineHeight: 1.4 } }, "新しい版があります", h("br"), h("span", { style: { fontSize: 12, fontWeight: 600, opacity: .9 } }, `${nv}（今は ${APP_VER}）`)),
    h("span", { style: { flexShrink: 0, background: "#fff", color: C.drop, borderRadius: 999, padding: "6px 12px", fontSize: 13.5 } }, "タップで更新"));
}

    const land = () => { try { if (screen.orientation && screen.orientation.type) return screen.orientation.type.indexOf("landscape") === 0; } catch (e) {} return Math.abs(window.orientation || 0) === 90; };
    let last = "";

      let key;

      // → iPhoneはCSS（上0・下0）で表示域いっぱいに合わせる（iPhoneはとなりのアプリがないので縮んだまま戻らない問題は起きない）。固定はiPadだけ

      if (standalone() && !phone && screen.width && screen.height) { const a = Math.max(screen.width, screen.height), b = Math.min(screen.width, screen.height); key = String(land() ? b : a); }
