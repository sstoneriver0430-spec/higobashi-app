function Header({ children, tall }) {

let _kinMonth = null, _kinSub = "";
function loadMonth() {
  const now = new Date(), mk = `${now.getFullYear()}-${pad(now.getMonth() + 1)}`;
  if (db) {
    if (_kinSub !== mk) { _kinSub = mk; _kinMonth = null; db.collection("kinshu").doc(mk).onSnapshot(d => { _kinMonth = d.exists ? (d.data().days || {}) : {}; emitAll(); }, e => console.error(e)); }
    return { data: _kinMonth || {}, demo: false };
  }
  try { const m = localStorage.getItem("higo_kinshu2_" + mk); if (m) return { data: JSON.parse(m), demo: false }; } catch (e) {}
  return { data: makeDemo(now.getFullYear(), now.getMonth(), now.getDate()), demo: true };
}

  let total = 0, cnt = 0;
  Object.values(data).forEach(e => { if (e.uday !== "" && e.uday != null) { total += Number(e.uday) || 0; cnt++; } });
  const days = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  const landing = cnt ? total / cnt * days : 0;

      // 設定
      h("div", { style: { ...cardStyle, marginTop: 10, overflow: "hidden" } },
        h(MenuRow, { icon: "staff", tint: C.ink, soft: C.lineSoft, title: "従業員名簿", badge: `${staff.length}人`, onClick: () => go("staff") })),
      // 準備中
      soon.length > 0 && h("div", { style: { marginTop: 18, padding: "0 4px" } },
        h("div", { style: { fontSize: 11.5, fontWeight: 800, color: C.subLight, marginBottom: 8 } }, "準備中"),
        h("div", { style: { display: "flex", gap: 6, flexWrap: "wrap" } },
          soon.map(p => h("button", { key: p.k, type: "button", onClick: () => go(p.k), style: { border: `1px dashed ${C.line}`, background: "transparent", color: C.sub, borderRadius: 999, padding: "7px 13px", fontSize: 12.5, fontWeight: 700, cursor: "pointer" } }, p.tile ? p.tile.replace("\n", "・") : p.title))))),
    h(Sheet, { open: meOpen, onClose: () => setMeOpen(false), title: "この端末を使う人" }, meOpen && h(MePicker, { onDone: () => setMeOpen(false) })));
}

function App() {
  const [, setTick] = useState(0);
  useEffect(() => { const f = () => setTick(t => t + 1); storeBus.add(f); return () => storeBus.delete(f); }, []);
  const valid = ["home", "staff", ...PAGES.map(p => p.k)];
  const init = (() => { const s = (location.hash || "").slice(1); return valid.includes(s) ? s : "home"; })();
  const [mode, setMode] = useState(init);
  const go = (k) => { setMode(k); window.scrollTo(0, 0); };
  const page = PAGES.find(p => p.k === mode);
  const navFor = NAV.includes(mode) ? mode : "home";
  return h("div", { style: { minHeight: "100vh", background: C.paper, fontFamily: FONT, color: C.ink } },
    h("style", null, `
      *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
      html,body{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;}
      button,input{font-family:inherit;}
      button{touch-action:manipulation;}
      .fk-appbar{padding-top:calc(12px + env(safe-area-inset-top, 0px));}
      .fk-tap{transition:transform .12s ease, box-shadow .12s ease;}
      .fk-tap:active{transform:scale(.97);}
      .fk-page{animation:fkIn .22s ease both;}
      .fk-sheet{animation:fkUp .24s cubic-bezier(.2,.8,.2,1) both;}
      @keyframes fkUp{from{transform:translateY(40px);opacity:.6;}to{transform:none;opacity:1;}}
      .fk-toast{animation:fkDrop .2s ease both;}
      @keyframes fkDrop{from{opacity:0;transform:translate(-50%,-8px);}to{opacity:1;transform:translate(-50%,0);}}
      @keyframes fkIn{from{opacity:.4;transform:translateY(6px);}to{opacity:1;transform:none;}}
      input{font-family:${FONT};}
      input:focus{border-color:${C.cyan} !important;box-shadow:0 0 0 3px ${C.cyanSoft};}
      button:focus-visible{outline:2px solid ${C.cyan};outline-offset:2px;}
      @media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important;}}
    `),
    mode === "home" ? h(Home, { go }) : mode === "kinshu" ? h("div", { className: "fk-page" }, h(KinshuApp, null)) : mode === "report" ? h(ReportApp, { key: "r" }) : mode === "lost" ? h(LostApp, null) : mode === "clean" ? h(CleanApp, null) : mode === "board" ? h(BoardApp, { go }) : mode === "staff" ? h(StaffPage, { go }) : h(Placeholder, { page, key: mode }),

            h("span", { style: { width: 54, height: 30, borderRadius: 999, display: "grid", placeItems: "center", background: on ? C.cyanSoft : "transparent", color: on ? C.cyanDeep : C.subLight } },
              h(Icon, { name: p ? p.icon : "home", size: 22, sw: on ? 2 : 1.7 })),
            h("span", { style: { fontSize: 10.5, whiteSpace: "nowrap" } }, p ? p.nav : "ホーム")); }))));
}
(function boot() {
  const root = ReactDOM.createRoot(document.getElementById("root"));
  const start = () => root.render(h(App, null));
  if (!db) { start(); return; }
  root.render(h("div", { style: { minHeight: "100vh", display: "grid", placeItems: "center", background: C.paper, fontFamily: FONT, color: C.sub, fontWeight: 800, fontSize: 14 } }, "接続しています…"));
  let done = false; const fin = () => { if (!done) { done = true; start(); } };
  try {
    firebase.auth().onAuthStateChanged(u => { if (u) fin(); });
    firebase.auth().signInAnonymously().catch(e => { fbAuthError = e.code || String(e); console.error(e); fin(); });
  } catch (e) { fbAuthError = String(e); fin(); }
  setTimeout(fin, 8000);
})();
